<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#成田香姫奈 最新ツイート 5件</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 24px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { font-size: 14px; color: #666; margin-top: 4px; }
    .container {
      max-width: 600px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .tweet-slot {
      margin-bottom: 16px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tweet-slot.loading::after {
      content: "Loading tweet...";
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>#成田香姫奈 最新ツイート 5件</h1>
    <p>Generated: 2026-03-20 00:01 — Embedded via X/Twitter</p>
  </header>
  <div class="container" id="container"></div>

  <script>
    const tweetIds = [
      "2034622766008443067",
      "2034577276243963944",
      "2034554061354373513",
      "2034439817363370138",
      "2034410002425995366"
];

    const container = document.getElementById('container');
    tweetIds.forEach((id, i) => {
      const slot = document.createElement('div');
      slot.className = 'tweet-slot loading';
      slot.id = 'tweet-' + i;
      container.appendChild(slot);
    });

    function loadTweets() {
      let index = 0;
      const batchSize = 5;

      function loadBatch() {
        const promises = [];
        for (let i = 0; i < batchSize && index < tweetIds.length; i++, index++) {
          const slot = document.getElementById('tweet-' + index);
          slot.classList.remove('loading');
          promises.push(
            twttr.widgets.createTweet(tweetIds[index], slot, {
              align: 'center', conversation: 'none', dnt: true
            })
          );
        }
        Promise.all(promises).then(() => {
          if (index < tweetIds.length) setTimeout(loadBatch, 500);
        });
      }

      loadBatch();
    }

    window.twttr = (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {};
      if (d.getElementById(id)) return t;
      js = d.createElement(s);
      js.id = id;
      js.src = "https://platform.twitter.com/widgets.js";
      fjs.parentNode.insertBefore(js, fjs);
      t._e = [];
      t.ready = function(f) { t._e.push(f); };
      return t;
    }(document, "script", "twitter-wjs"));

    twttr.ready(function() { loadTweets(); });
  </script>
</body>
</html>
